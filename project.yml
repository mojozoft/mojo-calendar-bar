# Xcode project สำหรับส่ง Mac App Store (สร้างด้วย `xcodegen generate` · .xcodeproj ไม่เก็บใน git)
# ใช้เองทุกวันยังใช้ ./build-app.sh เหมือนเดิม — ส่ง Store ใช้ ./store-release.sh
# ⚠️ เลขรุ่นมีที่เดียวคือ MARKETING_VERSION ที่นี่ (build-app.sh อ่านจากไฟล์นี้) · เลข build สคริปต์ส่ง Store ใส่เป็นเวลาเอง
name: MojoCalendarBar
options:
  bundleIdPrefix: com.mojozoft
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: KVQVC98SC8
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  MojoCalendarBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/MojoCalendarBar
      - path: Resources/Localizable.xcstrings
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mojozoft.calendarbar
        PRODUCT_NAME: MojoCalendarBar
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/MojoCalendarBar.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
