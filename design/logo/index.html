<script>
const OR = "#F26A1B";
const SQ = (fill) => `<rect x="0" y="0" width="100" height="100" rx="22.4" fill="${fill}"/>`;
// pin วงแหวน (วงนอก - รูใน) ด้วย evenodd
const pin = (x,y,r,h) => `M${x-r},${y}a${r},${r} 0 1,0 ${2*r},0a${r},${r} 0 1,0 ${-2*r},0Z M${x-h},${y}a${h},${h} 0 1,0 ${2*h},0a${h},${h} 0 1,0 ${-2*h},0Z`;
// M ต้นฉบับ Mojozoft (viewBox 100)
const M_ORIG = (c) => `<g color="${c}"><path d="M14.82,72.04L19.18,29.96M25.12,28.15L44.88,51.85M55.12,51.85L74.88,28.15M80.82,29.96L85.18,72.04" fill="none" stroke="currentColor" stroke-width="9"/>
<path fill="currentColor" fill-rule="evenodd" d="${[[14,80],[20,22],[50,58],[80,22],[86,80]].map(([x,y])=>pin(x,y,10,4.2)).join(' ')}"/></g>`;
// เส้นเชื่อมระหว่าง pin ที่หยุดที่ขอบ pin (กันก้านทับรู)
function link(pts, r, sw, c){
  let d = "";
  for (let i=0;i<pts.length-1;i++){
    const [x1,y1]=pts[i],[x2,y2]=pts[i+1],dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,g=r-2;
    d += `M${(x1+ux*g).toFixed(2)},${(y1+uy*g).toFixed(2)}L${(x2-ux*g).toFixed(2)},${(y2-uy*g).toFixed(2)}`;
  }
  return `<path d="${d}" fill="none" stroke="${c}" stroke-width="${sw}"/>
<path fill="${c}" fill-rule="evenodd" d="${pts.map(([x,y])=>pin(x,y,r,r*0.42)).join(' ')}"/>`;
}

// ✅ โลโก้ตัวจริง (ใช้ทำ AppIcon) — แก้ที่นี่ที่เดียว
function FINAL(){
  const n=3, area=56, gap=6, size=(area-gap*(n-1))/n, x0=(100-area)/2, y0=34;
  let out = SQ(OR) + `<path d="M0,22.4A22.4,22.4 0 0 1 22.4,0H77.6A22.4,22.4 0 0 1 100,22.4V25H0Z" fill="#fff" opacity=".2"/>`;
  for (let i=0;i<n;i++) for (let j=0;j<n;j++){
    const on = i===1 && j===1;
    out += `<rect x="${(x0+i*(size+gap)).toFixed(2)}" y="${(y0+j*(size+gap)).toFixed(2)}" width="${size.toFixed(2)}" height="${size.toFixed(2)}" rx="${(size*0.28).toFixed(2)}" fill="#fff" opacity="${on?1:.45}"/>`;
  }
  return out;
}
// หน้าเดือนแบบปรับจำนวนช่องได้ (พื้นส้ม + หัวขาวจาง) · skip = ช่องว่างต้นแถวแรก · lastKeep = จำนวนช่องแถวท้าย
function MONTH2({cols, rows, skip, lastKeep, today, sz, todaySz, y0=47, pitchY=15, round=false, x0=18, x1=82}){
  const pitchX=(x1-x0)/(cols-1);
  let out = SQ(OR) + `<path d="M0,22.4A22.4,22.4 0 0 1 22.4,0H77.6A22.4,22.4 0 0 1 100,22.4V27H0Z" fill="#fff" opacity=".2"/>`;
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
    if (r===0 && c<skip) continue;
    if (r===rows-1 && c>=lastKeep) continue;
    const on = c===today[0] && r===today[1], w = on ? todaySz : sz, cx=x0+c*pitchX, cy=y0+r*pitchY;
    out += `<rect x="${(cx-w/2).toFixed(2)}" y="${(cy-w/2).toFixed(2)}" width="${w}" height="${w}" rx="${(round ? w/2 : w*0.28).toFixed(2)}" fill="#fff" opacity="${on?1:.6}"/>`;
  }
  return out;
}
// หน้าเดือน 7 คอลัมน์ × 4 แถว: แถวแรกเริ่มที่คอลัมน์ 2 · แถวท้ายจบที่คอลัมน์ 4 · วันนี้ = [col,row]
function MONTH({style}){
  const page = style==="page";
  const cols=7, rows=4, x0=16, x1=84, pitch=(x1-x0)/(cols-1), sz=8;
  const y0 = page ? 42 : 40, ypitch = page ? 12 : 13;
  const today=[3,2];
  let out = page
    ? `<rect width="100" height="100" rx="22.4" fill="url(#fb)"/><path d="M0,22.4A22.4,22.4 0 0 1 22.4,0H77.6A22.4,22.4 0 0 1 100,22.4V29H0Z" fill="url(#fh)"/>`
    : SQ(OR) + `<path d="M0,22.4A22.4,22.4 0 0 1 22.4,0H77.6A22.4,22.4 0 0 1 100,22.4V27H0Z" fill="#fff" opacity=".2"/>`; // หัวปฏิทินขาวจาง
  const ink = page ? "#2b2b2b" : "#fff";
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
    if (r===0 && c<2) continue;          // เดือนเริ่มกลางสัปดาห์
    if (r===rows-1 && c>4) continue;     // เดือนจบก่อนสุดสัปดาห์
    const cx=x0+c*pitch, cy=y0+r*ypitch, on = c===today[0] && r===today[1];
    const s2 = on ? 13 : sz;
    out += `<rect x="${(cx-s2/2).toFixed(2)}" y="${(cy-s2/2).toFixed(2)}" width="${s2}" height="${s2}" rx="${(s2*0.3).toFixed(2)}" fill="${on ? (page?OR:"#fff") : ink}" opacity="${on?1:(page? .85 : .6)}"/>`;
  }
  return out;
}
// ช่องสี่เหลี่ยมมน n×n บนพื้นส้ม (วันนี้ = ขาวทึบ ช่องอื่นจาง)
function TILES({n, today}){
  const area=58, gap= n===4 ? 5 : 6, size=(area-gap*(n-1))/n, x0=(100-area)/2, y0=(100-area)/2;
  let out = SQ(OR);
  for (let i=0;i<n;i++) for (let j=0;j<n;j++){
    const on = today && i===today[0] && j===today[1];
    out += `<rect x="${(x0+i*(size+gap)).toFixed(2)}" y="${(y0+j*(size+gap)).toFixed(2)}" width="${size.toFixed(2)}" height="${size.toFixed(2)}" rx="${(size*0.28).toFixed(2)}" fill="#fff" opacity="${on?1:(today? .45 : .92)}"/>`;
  }
  return out;
}
// ตารางจุด 7×5 บนพื้นส้ม (วันนี้ = วงแหวนหมุด)
function GRID({today}){
  let out = SQ(OR);
  for (let i=0;i<7;i++) for (let j=0;j<5;j++){
    const x=20+i*10, y=28+j*11;
    if (today && i===today[0] && j===today[1])
      out += `<path fill="#fff" fill-rule="evenodd" d="${pin(x,y,6.8,2.8)}"/>`;
    else out += `<circle cx="${x}" cy="${y}" r="3.3" fill="#fff" opacity="${today? .55 : .92}"/>`;
  }
  return out;
}
// หน้าปฏิทินยิ้ม: พื้นขาวไล่เงา + หัวส้ม + ตา/ปาก
function FACE({eye, smile, ink}){
  const body = `<defs><linearGradient id="fb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e7e4"/></linearGradient>
<linearGradient id="fh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#EE5F12"/></linearGradient></defs>`
    + `<rect width="100" height="100" rx="22.4" fill="url(#fb)"/>`
    + `<path d="M0,22.4A22.4,22.4 0 0 1 22.4,0H77.6A22.4,22.4 0 0 1 100,22.4V27H0Z" fill="url(#fh)"/>`;
  const eyes = eye==="ring"
    ? `<path fill="${ink}" fill-rule="evenodd" d="${pin(33,49,9.5,3.8)} ${pin(67,49,9.5,3.8)}"/>`
    : `<ellipse cx="33" cy="49" rx="8" ry="9.5" fill="${ink}"/><ellipse cx="67" cy="49" rx="8" ry="9.5" fill="${ink}"/>`;
  const mouth = smile==="chain"
    ? link([[24,68],[38,81],[62,81],[76,68]], 6.4, 6.5, ink)
    : `<path d="M28,70Q50,93 72,70" fill="none" stroke="${ink}" stroke-width="7" stroke-linecap="round"/>
       <path fill="${ink}" fill-rule="evenodd" d="${pin(24,67,7,2.9)} ${pin(76,67,7,2.9)}"/>`;
  return body + eyes + mouth;
}

   svg:(()=>{ const P=[[20,75],[30,25],[50,50],[70,25],[80,75]], key=new Set(P.map(p=>p.join())); let dots="";

// ไอคอนอื่นใน Dock (ตัวเทียบ)
const OTHERS = [
  SQ("#fff")+`<path d="M0,22.4A22.4,22.4 0 0 1 22.4,0H77.6A22.4,22.4 0 0 1 100,22.4V30H0Z" fill="#f33"/><text x="50" y="80" font-size="50" fill="#222" text-anchor="middle" font-family="-apple-system">21</text>`,
  SQ("#06C755")+`<rect x="22" y="30" width="56" height="38" rx="18" fill="#fff"/>`,
  SQ("#1E8CF0")+`<circle cx="50" cy="50" r="26" fill="#fff"/><path d="M50,26 50,50 66,58" stroke="#1E8CF0" stroke-width="5" fill="none"/>`,
  SQ("#222")+`<path d="M30,35l14,15-14,15" stroke="#fff" stroke-width="7" fill="none"/><path d="M50,66h22" stroke="#fff" stroke-width="7"/>`,
  SQ("#FFD43B")+`<rect x="25" y="25" width="50" height="50" rx="6" fill="#fff"/>`,
];
const svg = (inner, px) => `<svg width="${px}" height="${px}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

let h = "";
for (const theme of ["light","dark"]) {
  h += `<h2>Dock ${theme==="light"?"พื้นสว่าง":"พื้นมืด"} (64 px)</h2>`;
  for (const L of LOGOS) {
    const icons = [OTHERS[0], OTHERS[1], L.svg, OTHERS[2], OTHERS[3], OTHERS[4]];
    h += `<div class="dock ${theme}">` + icons.map((s,i)=>`<span class="${i===2?'ours':''}">${svg(s,64)}</span>`).join("") + `<span style="color:${theme==='dark'?'#ccc':'#555'};font-size:13px;align-self:center">${L.th}</span></div>`;
  }
}
h += `<h2>ด่านย่อ (ขนาดจริงบนจอ)</h2><table><tr><th></th><th>128</th><th>64</th><th>32</th><th>16</th><th>16 บนพื้นมืด</th></tr>`;
for (const L of LOGOS) h += `<tr><td style="text-align:left">${L.th}</td>`+[128,64,32,16].map(p=>`<td>${svg(L.svg,p)}</td>`).join("")+`<td style="background:#1d1b20">${svg(L.svg,16)}</td></tr>`;
h += `</table><h2>การ์ด</h2>`;
for (const L of LOGOS) h += `<div class="card">${svg(L.svg,96)}<br><b>${L.th}</b><br>💡 ${L.idea}<br>✅ ${L.tone}<br>⚠️ ${L.risk}</div>`;
document.getElementById("out").innerHTML = h;
</script></body></html>
